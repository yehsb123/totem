# 모든 PR 과 dev·main push 에서 타입검사·테스트·빌드를 돌린다. 하나라도 실패하면 머지하지 않는다.
name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 타입 검사 (shared · api · web · console)
        run: npm run typecheck

      - name: Lint (web · console, 경고 0)
        run: npm run lint

      - name: API 테스트 (인메모리 MongoDB)
        run: npm run test -w @totem/api

      - name: API 빌드
        run: npm run build -w @totem/api

      - name: 메인(web) 빌드
        run: npm run build -w @totem/web
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: 콘솔(console) 정적 export 빌드
        run: npm run build -w @totem/console
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

  # 실제 브라우저로 메인 로그인 → 콘솔 인계 → 6개 화면 → 로그아웃 전체 흐름 (e2e/tests)
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium

      - name: E2E (api 인메모리 DB + web + console 개발 서버)
        run: npm run e2e
        env:
          CI: "true"
          NEXT_TELEMETRY_DISABLED: 1

      - name: 실패 시 리포트·트레이스 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  # API 운영 이미지가 실제로 빌드되고, 운영 모드로 떠서 헬스체크·시드·정리가 되는지 (docs/DEPLOY.md 3절 그대로)
  api-image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
    steps:
      - uses: actions/checkout@v5

      - name: 이미지 빌드
        run: docker build -f apps/api/Dockerfile -t totem-api:ci .

      - name: 운영 모드 기동 → 헬스체크
        run: |
          docker run -d --name api --network host \
            -e NODE_ENV=production -e PORT=8000 -e MONGO_URI=mongodb://127.0.0.1:27017 -e MONGO_DB_NAME=ci \
            -e JWT_ACCESS_SECRET=ci-only-secret-0123456789abcdef0123 -e CORS_ORIGINS=https://example.com \
            totem-api:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/v1/health && exit 0; sleep 1; done
          docker logs api; exit 1

      - name: 같은 이미지로 시드·정리 (운영 문서의 명령)
        run: |
          E="-e NODE_ENV=production -e MONGO_URI=mongodb://127.0.0.1:27017 -e MONGO_DB_NAME=ci -e JWT_ACCESS_SECRET=ci-only-secret-0123456789abcdef0123 -e CORS_ORIGINS=https://example.com"
          docker run --rm --network host $E totem-api:ci node dist/db/seed/run.js
          docker run --rm --network host $E totem-api:ci node dist/db/purge-run.js

      - name: 필수 환경변수 없이 기동하면 거부
        run: |
          if docker run --rm -e NODE_ENV=production totem-api:ci; then echo "기동 거부가 안 됨"; exit 1; fi
