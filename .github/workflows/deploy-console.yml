# 콘솔(로그인 후 기능 화면) → GitHub Pages.
# main 에 콘솔·공용 계약이 바뀌어 머지되면 자동 배포. Actions 탭에서 수동 실행도 가능.
#
# 사전 설정 (한 번만):
#   1) Settings > Pages > Build and deployment > Source = "GitHub Actions"
#   2) Settings > Secrets and variables > Actions > Variables 에 등록
#        CONSOLE_API_BASE_URL      예) https://api.totem.example.com
#        CONSOLE_WEB_URL           예) https://totem.vercel.app
#        CONSOLE_KAKAO_MAP_APP_KEY 카카오 JavaScript 키 (선택)
#      (NEXT_PUBLIC_ 값은 브라우저에 공개되는 값이라 Secrets 가 아니라 Variables 에 둔다)
name: Deploy console to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - apps/console/**
      - packages/shared/**
      - package-lock.json
      - .github/workflows/deploy-console.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: 필수 변수 확인
        env:
          API: ${{ vars.CONSOLE_API_BASE_URL }}
          WEB: ${{ vars.CONSOLE_WEB_URL }}
        run: |
          missing=""
          [ -z "$API" ] && missing="$missing CONSOLE_API_BASE_URL"
          [ -z "$WEB" ] && missing="$missing CONSOLE_WEB_URL"
          if [ -n "$missing" ]; then
            echo "::error::Actions Variables 가 없습니다:$missing (docs/DEPLOY.md 참고)"
            exit 1
          fi

      - run: npm ci

      - name: 정적 export 빌드
        run: npm run build -w @totem/console
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.CONSOLE_API_BASE_URL }}
          NEXT_PUBLIC_WEB_URL: ${{ vars.CONSOLE_WEB_URL }}
          NEXT_PUBLIC_KAKAO_MAP_APP_KEY: ${{ vars.CONSOLE_KAKAO_MAP_APP_KEY }}

      - name: Pages 보정
        working-directory: apps/console/out
        run: |
          # Jekyll 이 밑줄로 시작하는 _next/ 폴더를 무시하지 않도록
          touch .nojekyll
          # 없는 경로는 GitHub Pages 가 404.html 을 보여준다
          cp -n 404/index.html 404.html 2>/dev/null || true

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/console/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
